name: Ruby CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruby 3.3 / Sinatra ${{ matrix.sinatra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sinatra: ['~> 2.2', '~> 3.2', '~> 4.0']
    env:
      SINATRA_VERSION: ${{ matrix.sinatra }}
      COVERALLS_REPO_TOKEN: ${{ matrix.sinatra == '~> 4.0' && secrets.COVERALLS_REPO_TOKEN || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'

      - name: Install dependencies
        run: bundle install

      - name: Run tests
        run: bundle exec rake test
